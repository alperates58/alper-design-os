name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core-portability-matrix:
    name: Core Portability (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Preflight Doctor Check (Prerequisites & Clean Topology)
        run: node scripts/doctor.js --preflight

      - name: Install Monorepo Dependencies (Deterministic Frozen Lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo (TypeScript Composite Build)
        run: pnpm run build

      - name: Run Test Suite (Vitest)
        run: pnpm test

      - name: Full System Doctor Check
        run: node scripts/doctor.js --json

  generated-project-certification:
    name: Generated Project Native Build Certification & Packaging
    needs: [core-portability-matrix]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9.15.4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22.x'
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Setup .NET SDK 8.0 (for ASPNET_RAZOR native builds)
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Setup PHP 8.3 & Composer (for LARAVEL_BLADE native builds)
        uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.32.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Monorepo
        run: pnpm run build

      - name: Execute Security & Compliance Gates
        run: |
          node scripts/scan-repository-secrets.js
          node scripts/audit-licenses.js

      - name: Execute Real Generated Project Native Build Matrix
        run: node scripts/verify-generated-builds.js
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ secrets.GITHUB_TOKEN }}"}}'

      - name: Validate Version Consistency & Release Packaging
        run: node scripts/package-distribution.js

      - name: Upload Pre-v1 Release Candidate Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: alper-design-os-release-candidate
          path: dist-release/
          if-no-files-found: error
          retention-days: 14
