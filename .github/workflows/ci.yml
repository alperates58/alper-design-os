name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix-build-test:
    name: Build & Test (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup .NET SDK (for ASPNET_RAZOR generated builds)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup PHP (for LARAVEL_BLADE generated builds)
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Verify Environment Contract
        run: node scripts/doctor.js

      - name: Install Monorepo Dependencies
        run: npm ci || npm install

      - name: Build Monorepo (TypeScript Composite Build)
        run: npm run build

      - name: Run Test Suite (Vitest)
        run: npm test

      - name: Verify Doctor V2 Health
        run: node scripts/doctor.js --json

      - name: Run Generated Project Native Build Matrix
        run: node scripts/verify-generated-builds.js

      - name: Validate Version Consistency & Release Packaging
        run: node scripts/package-distribution.js
